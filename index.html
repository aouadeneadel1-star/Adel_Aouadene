<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bientôt disponible</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #14100d;
    color: #e8e2d8;
    font-family: 'Courier New', Consolas, monospace;
    text-align: center;
    padding: 24px;
  }

  .container {
    max-width: 480px;
  }

  .label {
    letter-spacing: 0.2em;
    font-size: 0.75rem;
    color: #a89f8c;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  h1 {
    font-size: clamp(2rem, 8vw, 3.2rem);
    line-height: 1.15;
    font-weight: 700;
    color: #f2ede2;
  }

  h1 span {
    color: #c9bfa8;
    border-bottom: 3px solid #5b6cff;
    padding-bottom: 4px;
  }

  .sub {
    margin-top: 24px;
    font-size: 1rem;
    color: #a89f8c;
    line-height: 1.6;
  }

  .bar {
    margin-top: 32px;
    height: 6px;
    width: 100%;
    background: #2a2420;
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 35%;
    background: linear-gradient(90deg, #5b6cff, #8f9cff);
    border-radius: 4px;
    animation: pulse 2.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%   { width: 20%; }
    50%  { width: 60%; }
    100% { width: 20%; }
  }

  .footer {
    margin-top: 28px;
    font-size: 0.8rem;
    color: #6f6858;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="label">En préparation</div>
    <h1>Bientôt <span>disponible</span></h1>
    <p class="sub">Ce site est en cours de construction. Revenez très vite pour découvrir ce qui vous attend.</p>
    <div class="bar"><div class="bar-fill"></div></div>
    <div class="footer">© 2026 — Tous droits réservés</div>
  </div>
</body>
</html>
